name: spatial_python_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26
  - scipy=1.11
  - anndata=0.9.2
  - squidpy
  - scikit-image
  - streamlit
  - pip
  - pip:
    # "harpy-spatial" is not a real PyPI package (verified — no such package
    # exists) and `pip install` of it will fail outright. The package that
    # provides `import harpy` is "harpy-analysis"; pinned to match the
    # version the Dockerfile installs (also sourced from the Mac environment).
    - harpy-analysis==0.3.0