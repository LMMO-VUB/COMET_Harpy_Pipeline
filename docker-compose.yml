services:
  comet_pipeline:
    image: spatial_pipeline:v1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comet_pipeline
    volumes:
      # Pipeline code: the git repository itself, read-only inside the container.
      # Update by running "git pull" in the pipeline folder -- no rebuild needed.
      - .:/pipeline:ro

      # Researcher's run folder: inputs in, results out.
      # RUN_DIR is set by the GUI launcher (launch_pipeline_gui.py) before this runs.
      - ${RUN_DIR}:/data

    # Streamlit annotation portal -- port is configurable via the GUI.
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"

    environment:
      # Force Python to flush stdout/stderr immediately so progress lines
      # (PCA, clustering, etc.) appear in the log as they happen, not after
      # the entire step finishes.
      - PYTHONUNBUFFERED=1
      # NUMBA_NUM_THREADS/OMP_NUM_THREADS/MKL_NUM_THREADS below are informational
      # only -- the Snakefile now forces all three (plus a few others) to "1"
      # via os.environ at parse time, on every platform it runs on, regardless
      # of what's set here. That's deliberate: a mismatched NUMBA_NUM_THREADS
      # between Mac and Windows (this file previously set 4 here; the Mac had
      # no override, so it defaulted to all cores) was one of several
      # confirmed contributors to Mac vs Windows runs producing different
      # Leiden cluster counts and UMAP layouts from identical config. See the
      # Snakefile's own comment on this for the full explanation.
      - NUMBA_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1

    # Inline command avoids shell-script line-ending issues on Windows.
    # --unlock clears any stale lock left by a previous force-kill before
    # the real run starts (harmless when no lock exists).
    #
    # This used to also seed /data/metadata_markers.csv from this image's
    # own bundled copy whenever /data didn't have one -- removed 2026-09-25.
    # That was actively wrong, not just a redundant safety net: the Snakefile
    # already has its own proper handling for a missing metadata_markers.csv
    # (see its "Auto-generate metadata_markers.csv if absent" block, which
    # calls generate_metadata.py to derive marker names from this dataset's
    # own CSV headers, the same way a native macOS run behaves). Seeding a
    # generic placeholder file here BEFORE Snakemake ever ran meant
    # Snakemake's own "if not os.path.exists(metadata_file)" check always
    # found a file already present and silently skipped its real,
    # dataset-aware auto-generation -- so every Docker run on a
    # network-drive project folder (where launch_pipeline_gui.py's staging
    # step didn't carry the project's real metadata_markers.csv along; see
    # that file's own history) got a generic bundled marker list nothing
    # ever validated against the actual data, instead of either the
    # project's real file or a properly auto-generated one. Confirmed this
    # produced genuinely different Leiden cluster counts and UMAPs from a
    # native run of the exact same CSV. Removing this block makes Docker
    # behave exactly like a native run: if metadata_markers.csv is missing,
    # Snakemake generates one from the real data and says so in its own log.
    entrypoint:
      - "bash"
      - "-c"
      - "set -e && echo '[entrypoint] Pipeline: /pipeline  Data: /data' && echo '[entrypoint] Clearing any stale Snakemake lock...' && snakemake --snakefile /pipeline/Snakefile --configfile /data/config.yaml --directory /data --unlock 2>/dev/null || true && echo '[entrypoint] Starting Snakemake...' && exec snakemake --snakefile /pipeline/Snakefile --configfile /data/config.yaml --directory /data --cores all --rerun-incomplete"
