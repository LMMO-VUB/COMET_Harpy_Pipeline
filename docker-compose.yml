services:
  comet_pipeline:
    image: spatial_pipeline:v1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comet_pipeline
    volumes:
      # Pipeline code: the git repository itself, read-only inside the container.
      # Update by running "git pull" in the pipeline folder -- no rebuild needed.
      - .:/pipeline:ro

      # Researcher's run folder: inputs in, results out.
      # RUN_DIR is set by the GUI launcher (launch_pipeline_gui.py) before this runs.
      - ${RUN_DIR}:/data

    # Streamlit annotation portal -- port is configurable via the GUI.
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"

    environment:
      # Force Python to flush stdout/stderr immediately so progress lines
      # (PCA, clustering, etc.) appear in the log as they happen, not after
      # the entire step finishes.
      - PYTHONUNBUFFERED=1
      # NUMBA_NUM_THREADS/OMP_NUM_THREADS/MKL_NUM_THREADS below are informational
      # only -- the Snakefile now forces all three (plus a few others) to "1"
      # via os.environ at parse time, on every platform it runs on, regardless
      # of what's set here. That's deliberate: a mismatched NUMBA_NUM_THREADS
      # between Mac and Windows (this file previously set 4 here; the Mac had
      # no override, so it defaulted to all cores) was one of several
      # confirmed contributors to Mac vs Windows runs producing different
      # Leiden cluster counts and UMAP layouts from identical config. See the
      # Snakefile's own comment on this for the full explanation.
      - NUMBA_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1

    # Inline command avoids shell-script line-ending issues on Windows.
    # Seeds metadata_markers.csv into /data if absent, then runs Snakemake.
    # --unlock clears any stale lock left by a previous force-kill before
    # the real run starts (harmless when no lock exists).
    #
    # The "if absent, copy the pipeline's own metadata_markers.csv into
    # /data" fallback below is a safety net for a first-time project setup,
    # NOT something that should ever fire for a real, already-configured
    # project. Confirmed on 2026-09-25 that it fired silently for every
    # Docker run on a network-drive project folder, because
    # launch_pipeline_gui.py's staging step (needed on network drives) only
    # copied the CSV, never the project's own metadata_markers.csv -- so
    # Docker runs were silently using this image's placeholder marker list
    # (wrong marker names, missing most of the real panel) instead of the
    # researcher's actual one, producing genuinely different Leiden cluster
    # counts and UMAPs from a native run of the exact same CSV. The GUI
    # launcher now stages metadata_markers.csv too, so this fallback should
    # no longer trigger in normal use -- but if it ever does again (for any
    # reason, on any machine), it now prints a loud, impossible-to-miss
    # warning instead of one quiet line easily lost among normal startup
    # output, so nobody loses hours to this again before noticing.
    entrypoint:
      - "bash"
      - "-c"
      - "set -e && echo '[entrypoint] Pipeline: /pipeline  Data: /data' && if [ ! -f /data/metadata_markers.csv ] && [ -f /pipeline/metadata_markers.csv ]; then echo '' && echo '=================================================================' && echo '[entrypoint] !!! WARNING: /data/metadata_markers.csv NOT FOUND !!!' && echo '[entrypoint] Falling back to the PLACEHOLDER metadata_markers.csv' && echo '[entrypoint] bundled in this image. This is almost certainly NOT' && echo '[entrypoint] the marker panel for your dataset -- results from this' && echo '[entrypoint] run should NOT be trusted until this is fixed.' && echo '[entrypoint] Put your project'\\''s real metadata_markers.csv in its' && echo '[entrypoint] run folder and re-run.' && echo '=================================================================' && echo '' && cp /pipeline/metadata_markers.csv /data/metadata_markers.csv; fi && echo '[entrypoint] Clearing any stale Snakemake lock...' && snakemake --snakefile /pipeline/Snakefile --configfile /data/config.yaml --directory /data --unlock 2>/dev/null || true && echo '[entrypoint] Starting Snakemake...' && exec snakemake --snakefile /pipeline/Snakefile --configfile /data/config.yaml --directory /data --cores all --rerun-incomplete"
