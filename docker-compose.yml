services:
  comet_pipeline:
    image: spatial_pipeline:v1
    container_name: comet_pipeline
    volumes:
      # Pipeline code: the git repository itself, read-only inside the container.
      # Update by running "git pull" in the pipeline folder -- no rebuild needed.
      - .:/pipeline:ro

      # Researcher's run folder: inputs in, results out.
      # RUN_DIR is set by the GUI launcher (launch_pipeline_gui.py) before this runs.
      - ${RUN_DIR}:/data

    # Streamlit annotation portal -- port is configurable via the GUI.
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"

    environment:
      # Force Python to flush stdout/stderr immediately so progress lines
      # (PCA, clustering, etc.) appear in the log as they happen, not after
      # the entire step finishes.
      - PYTHONUNBUFFERED=1
      # Limit numba/OpenMP/MKL thread pools to prevent deadlocks inside Docker.
      # With 40 cores visible, numba spawns 40 threads per pool and they can
      # deadlock when nested. 4 threads is enough for neighbourhood enrichment.
      - NUMBA_NUM_THREADS=4
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4

    # Inline command avoids shell-script line-ending issues on Windows.
    # Seeds metadata_markers.csv into /data if absent, then runs Snakemake.
    # --unlock clears any stale lock left by a previous force-kill before
    # the real run starts (harmless when no lock exists).
    entrypoint:
      - "bash"
      - "-c"
      - "set -e && echo '[entrypoint] Pipeline: /pipeline  Data: /data' && if [ ! -f /data/metadata_markers.csv ] && [ -f /pipeline/metadata_markers.csv ]; then echo '[entrypoint] Copying metadata_markers.csv...'; cp /pipeline/metadata_markers.csv /data/metadata_markers.csv; fi && echo '[entrypoint] Clearing any stale Snakemake lock...' && snakemake --snakefile /pipeline/Snakefile --configfile /data/config.yaml --directory /data --unlock 2>/dev/null || true && echo '[entrypoint] Starting Snakemake...' && exec snakemake --snakefile /pipeline/Snakefile --configfile /data/config.yaml --directory /data --cores all --rerun-incomplete"
